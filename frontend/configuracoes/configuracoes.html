<!DOCTYPE html><html lang="pt-BR" class="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Configurações</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="../css/nav.css"></head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen p-6"><div class="max-w-xl mx-auto space-y-4">
  <h1 class="text-xl font-bold text-emerald-500">Configurações Financeiras</h1>
  <p class="text-xs text-zinc-500">Sua chave nunca aparece no F12 - vai criptografada para o backend.</p>
  <form id="form-mp" class="bg-zinc-900 border border-zinc-800 rounded-xl p-4 space-y-3">
    <input id="mp-token" type="password" placeholder="MP Access Token (APP_USR-...)" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-sm">
    <input id="faixa" placeholder="Faixa (ex: AZUL, PRETA)" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-sm">
    <button class="w-full bg-emerald-600 py-2.5 rounded-xl font-bold text-sm">Salvar</button>
  </form>
</div><script type="module">import{renderNav} from '../js/nav.js'; renderNav('Config');</script><script type="module" src="configuracoes.js"></script></body></html>
