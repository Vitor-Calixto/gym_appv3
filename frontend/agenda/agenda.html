<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniSystem - Agenda</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="agenda.css">
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen p-6 fade-in">
  <div class="max-w-4xl mx-auto space-y-6">
    <header class="flex justify-between items-center border-b border-zinc-800 pb-4">
      <div>
        <h1 class="text-xl font-bold text-emerald-500">Agenda de Avaliações</h1>
        <p class="text-sm text-zinc-400">Próximos compromissos</p>
      </div>
      <button class="bg-emerald-500 hover:bg-emerald-600 text-zinc-950 px-4 py-2 rounded-lg text-sm font-bold transition">+ Novo Agendamento</button>
    </header>

    <main class="bg-zinc-900 border border-zinc-800 rounded-xl p-6">
      <div id="lista-agenda" class="space-y-3">
        <p class="text-sm text-zinc-500 text-center py-4">Carregando compromissos...</p>
      </div>
    </main>

    <a href="javascript:history.back()" class="inline-block text-sm text-zinc-500 hover:text-emerald-400">&larr; Voltar</a>
  </div>
  <script type="module" src="agenda.js"></script>
</body>
</html>
