<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniSystem - Anamnese</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="anamnese.css">
  <link rel="stylesheet" href="../css/nav.css">
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen p-6 fade-in">
  <div class="max-w-2xl mx-auto space-y-6">
    <header class="border-b border-zinc-800 pb-4">
      <h1 class="text-xl font-bold text-emerald-500">Ficha de Anamnese</h1>
      <p class="text-sm text-zinc-400">Atualize seus dados para a prescrição de treino</p>
    </header>

    <form id="form-anamnese" class="bg-zinc-900 p-6 rounded-xl border border-zinc-800 space-y-5">
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs text-zinc-400 mb-1">Peso Atual (kg)</label>
          <input type="number" step="0.1" id="peso" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-3 text-sm text-zinc-200 focus:border-emerald-500 outline-none">
        </div>
        <div>
          <label class="block text-xs text-zinc-400 mb-1">Altura (cm)</label>
          <input type="number" id="altura" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-3 text-sm text-zinc-200 focus:border-emerald-500 outline-none">
        </div>
      </div>

      <div>
        <label class="block text-xs text-zinc-400 mb-1">Objetivo Principal</label>
        <select id="objetivo" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-3 text-sm text-zinc-200 focus:border-emerald-500 outline-none">
          <option value="Hipertrofia">Hipertrofia</option>
          <option value="Emagrecimento">Emagrecimento</option>
          <option value="Condicionamento">Condicionamento Físico</option>
          <option value="Reabilitacao">Reabilitação</option>
        </select>
      </div>

      <div>
        <label class="block text-xs text-zinc-400 mb-1">Possui lesões ou dores articulares?</label>
        <textarea id="lesoes" rows="3" placeholder="Ex: Dor no joelho direito ao agachar..." class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-3 text-sm text-zinc-200 focus:border-emerald-500 outline-none resize-none"></textarea>
      </div>

      <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-zinc-950 font-bold py-3 rounded-lg transition text-sm">Salvar Anamnese</button>
    </form>
    
    <a href="../home/home.html" class="block text-center text-sm text-zinc-500 hover:text-emerald-400">&larr; Voltar ao Início</a>
  </div>
  <script type="module" src="anamnese.js"></script>
  <script type="module">import{renderNav} from '../js/nav.js'; renderNav('ANAMNESE');</script>
</body>
</html>
