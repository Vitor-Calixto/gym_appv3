<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CALIXTO • Screensaver</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
  .float { animation: float 4s ease-in-out infinite; }
  .glass { backdrop-filter: blur(12px); }
</style>
</head>
<body class="bg-black text-white h-screen w-screen overflow-hidden flex flex-col select-none">
  <!-- Centro screensaver -->
  <div class="flex-1 flex flex-col items-center justify-center p-6 text-center">
    <p class="text-xs tracking-[0.3em] text-zinc-500 mb-2">CALIXTO OMNISYSTEM</p>
    <h1 id="fase-atual" class="text-lg md:text-xl font-bold tracking-tight">Fase A — Convite/Aceite</h1>
    <div class="w-full max-w-xl mt-6">
      <div class="flex justify-between text-xs mb-1"><span class="text-zinc-500">Progresso geral</span><span id="porcentagem" class="text-emerald-400">14%</span></div>
      <div class="w-full bg-zinc-800 rounded-full h-4"><div id="barra-central" class="bg-emerald-500 h-4 rounded-full transition-all duration-700" style="width:14%"></div></div>
    </div>
    <p id="detalhe" class="text-xs text-zinc-600 mt-4 max-w-md">Sincronizando...</p>
  </div>

  <!-- Barra minimalista embaixo -->
  <div class="w-full h-1 bg-zinc-900">
    <div id="barra-geral" class="h-1 bg-emerald-500 transition-all duration-700" style="width:14%"></div>
  </div>
  <div class="flex justify-between text-[10px] text-zinc-600 px-3 py-1">
    <span id="hora">--</span>
    <span>vFinal • auto • 2s</span>
  </div>

<script>
async function atualizar(){
  try{
    const r=await fetch('progress.json?'+Date.now());
    const d=await r.json();
    const total=d.fases.reduce((a,f)=>a+f.progresso,0)/d.fases.length;
    document.getElementById('barra-geral').style.width=total.toFixed(1)+'%';
    const barraCentral=document.getElementById('barra-central');
    if(barraCentral) barraCentral.style.width=total.toFixed(1)+'%';
    document.getElementById('porcentagem').textContent=total.toFixed(0)+'%';
    const atual=d.fases.find(f=>f.status==='em_progresso')||d.fases.find(f=>f.status!=='concluida')||d.fases[d.fases.length-1];
    document.getElementById('fase-atual').textContent=atual?atual.nome:d.atual;
    // detalhe da fase atual
    const det={ 'Fase D - Blindagem':'helmet/rateLimit/bloquear ADMIN','Fase A - Convite/Aceite':'Convite model + token','Fase B - Dashboard':'cards foto/whatsapp','Fase C - Mercado Pago':'SDK + webhook','Smart Fit 400 PT-BR':'400 exercícios','Cap.7 E-Learning + Lutas':'Aulas + PIX + lutas','Mega Revisão + Push':'revisão final'};
    document.getElementById('detalhe').textContent=det[atual.nome]||'';
  }catch(e){}
}
atualizar(); setInterval(atualizar,2000);

function tick(){
  document.getElementById('hora').textContent=new Date().toLocaleString('pt-BR');
}
setInterval(tick,1000); tick();
</script>
</body>
</html>
