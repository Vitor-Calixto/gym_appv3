<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calixto OmniSystem - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="index.css">
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-zinc-900 border border-zinc-800 rounded-2xl p-8 shadow-2xl">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-black tracking-tight text-emerald-500">CALIXTO</h1>
      <p class="text-xs tracking-widest text-zinc-400 font-semibold uppercase mt-1">OmniSystem SaaS</p>
    </div>

    <form id="form-login" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-zinc-300 mb-1">E-mail</label>
        <input type="email" id="email" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 transition">
      </div>

      <div>
        <label class="block text-sm font-medium text-zinc-300 mb-1">Senha</label>
        <input type="password" id="senha" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 transition">
      </div>

      <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-zinc-950 font-bold py-3 rounded-lg transition text-sm">Entrar na Plataforma</button>
    </form>

    <div class="mt-6 text-center space-y-2 text-sm">
      <a href="../esqueci-senha/esqueci-senha.html" class="block text-zinc-500 hover:text-emerald-400 transition">Esqueci minha senha</a>
      <p class="text-zinc-500">Não tem conta? <a href="../cadastro/cadastro.html" class="text-emerald-400 hover:text-emerald-300 font-medium">Cadastre-se</a></p>
    </div>

    <div id="erro" class="mt-4 text-center text-red-500 text-sm hidden"></div>
  </div>

  <script type="module" src="index.js"></script>
</body>
</html>
