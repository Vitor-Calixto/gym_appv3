<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniSystem - Financeiro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="financeiro.css">
  <link rel="stylesheet" href="../css/nav.css">
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen p-6 fade-in">
  <div class="max-w-4xl mx-auto space-y-6">
    <header class="border-b border-zinc-800 pb-4">
      <h1 class="text-xl font-bold text-emerald-500">Financeiro</h1>
      <p class="text-sm text-zinc-400">Histórico de Mensalidades</p>
    </header>

    <div class="bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden">
      <table class="w-full text-left text-sm">
        <thead class="bg-zinc-950 text-zinc-400">
          <tr>
            <th class="p-4 font-medium">Referência</th>
            <th class="p-4 font-medium">Vencimento</th>
            <th class="p-4 font-medium">Valor</th>
            <th class="p-4 font-medium">Status</th>
          </tr>
        </thead>
        <tbody id="tabela-financeiro" class="divide-y divide-zinc-800">
          <!-- Renderizado via JS -->
        </tbody>
      </table>
    </div>
    
    <a href="javascript:history.back()" class="inline-block text-sm text-zinc-500 hover:text-emerald-400">&larr; Voltar</a>
  </div>
  <script type="module" src="financeiro.js"></script>
  <script type="module">import{renderNav} from '../js/nav.js'; renderNav('FINANCEIRO');</script>
</body>
</html>
