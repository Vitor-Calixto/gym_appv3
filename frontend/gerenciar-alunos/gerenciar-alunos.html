<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniSystem - Gerenciar Alunos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="gerenciar-alunos.css">
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen p-6 fade-in">
  <div class="max-w-5xl mx-auto space-y-6">
    <header class="flex justify-between items-center border-b border-zinc-800 pb-4">
      <h1 class="text-xl font-bold text-emerald-500">Alunos</h1>
      <button class="bg-emerald-500 hover:bg-emerald-600 text-zinc-950 px-4 py-2 rounded-lg text-sm font-bold transition">+ Novo Aluno</button>
    </header>
    <div class="bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden">
      <table class="w-full text-left text-sm">
        <thead class="bg-zinc-950 text-zinc-400">
          <tr>
            <th class="p-4 font-medium">Nome</th>
            <th class="p-4 font-medium">E-mail</th>
            <th class="p-4 font-medium">Status</th>
            <th class="p-4 font-medium text-right">Ações</th>
          </tr>
        </thead>
        <tbody id="tabela-alunos" class="divide-y divide-zinc-800">
          <tr><td colspan="4" class="p-4 text-center text-zinc-500">Carregando...</td></tr>
        </tbody>
      </table>
    </div>
    <a href="../admin-painel/admin-painel.html" class="inline-block text-sm text-zinc-500 hover:text-emerald-400">&larr; Voltar ao Painel</a>
  </div>
  <script type="module" src="gerenciar-alunos.js"></script>
</body>
</html>
