<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniSystem - Recuperar Senha</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="esqueci-senha.css">
  <link rel="stylesheet" href="../css/nav.css">
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex items-center justify-center p-4 fade-in">
  <div class="w-full max-w-md bg-zinc-900 border border-zinc-800 rounded-2xl p-8 shadow-2xl">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-zinc-100">Recuperar Acesso</h1>
      <p class="text-sm text-zinc-400 mt-2">Enviaremos um link de recuperação para o seu e-mail.</p>
    </div>

    <form id="form-recuperar" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-zinc-300 mb-1">E-mail Cadastrado</label>
        <input type="email" id="email" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 transition">
      </div>
      <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-zinc-950 font-bold py-3 rounded-lg transition text-sm">Enviar Link</button>
    </form>

    <div id="mensagem" class="mt-4 text-center text-sm hidden"></div>

    <div class="mt-6 text-center">
      <a href="../index/index.html" class="text-sm text-zinc-400 hover:text-emerald-400 transition">&larr; Voltar ao Login</a>
    </div>
  </div>
  <script type="module" src="esqueci-senha.js"></script>
  <script type="module">import{renderNav} from '../js/nav.js'; renderNav('ESQUECI SENHA');</script>
</body>
</html>
