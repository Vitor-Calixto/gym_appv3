<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniSystem - Biblioteca de Treinos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="meus-treinos.css">
  <link rel="stylesheet" href="../css/nav.css">
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen p-6 fade-in">
  <div class="max-w-4xl mx-auto space-y-6">
    <header class="flex justify-between items-center border-b border-zinc-800 pb-4">
      <h1 class="text-xl font-bold text-emerald-500">Biblioteca de Treinos</h1>
      <input type="text" id="busca-treino" placeholder="Buscar treino..." class="bg-zinc-900 border border-zinc-800 rounded-lg px-4 py-2 text-sm text-zinc-200 focus:border-emerald-500 outline-none">
    </header>

    <div id="grid-treinos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
      <p class="text-zinc-500 text-sm">Buscando fichas no sistema...</p>
    </div>
    
    <a href="../home/home.html" class="inline-block text-sm text-zinc-500 hover:text-emerald-400">&larr; Voltar</a>
  </div>
  <script type="module" src="meus-treinos.js"></script>
  <script type="module">import{renderNav} from '../js/nav.js'; renderNav('MEUS TREINOS');</script>
</body>
</html>
