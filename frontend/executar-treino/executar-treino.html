<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniSystem - Execução</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="executar-treino.css">
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
  <!-- Header -->
  <div class="sticky top-0 z-30 bg-zinc-900 border-b border-zinc-800">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
      <div>
        <h1 id="treino-titulo" class="font-bold text-emerald-500">Carregando...</h1>
        <a href="../home/home.html" class="text-xs text-zinc-500 hover:text-emerald-400">← Voltar</a>
      </div>
      <div class="text-center">
        <p class="text-[10px] text-zinc-500 tracking-widest">DESCANSO</p>
        <div id="cronometro" class="text-xl font-mono bg-zinc-950 border border-zinc-800 px-3 py-1 rounded-lg">00:00</div>
        <button id="toggle-voz" class="text-[10px] bg-zinc-800 px-2 py-0.5 rounded-full mt-1">🔊 Voz: ON</button>
      </div>
    </div>
  </div>

  <div class="max-w-3xl mx-auto px-4 py-4 space-y-3">
    <label class="flex items-center gap-2 text-sm"><input type="checkbox" id="usar-cronometro" checked class="accent-emerald-500"> Usar Cronômetro?</label>
    <p class="text-sm text-zinc-400">Treino em formato de <b class="text-white">circuito</b>, com 1 passagem.</p>
    
    <div id="offline-alert" class="hidden bg-yellow-500/10 border border-yellow-500/30 text-yellow-400 text-xs p-2 rounded-xl text-center">⚠️ Offline - progresso salvo localmente</div>

    <div id="lista-exercicios" class="space-y-3"></div>

    <div id="cronometro-global" class="hidden bg-zinc-900 border border-zinc-800 rounded-xl p-3 text-center">
      <div id="tempo-global" class="text-2xl font-mono">00:00.00</div>
      <div class="flex gap-2 justify-center mt-2">
        <button id="btn-pause" class="bg-zinc-800 px-4 py-1 rounded">⏸</button>
        <button id="btn-stop" class="bg-zinc-800 px-4 py-1 rounded">⏹</button>
      </div>
      <button id="btn-intervalo" class="w-full mt-3 bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-xl">FAZER INTERVALO DE DESCANSO</button>
    </div>
  </div>

  <!-- Modal Vamos treinar? -->
  <div id="modal-inicio" class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl w-full max-w-sm overflow-hidden">
      <div class="bg-teal-600 text-white text-center py-3 font-bold">Vamos treinar agora?</div>
      <div class="flex gap-3 p-4 bg-zinc-100">
        <button id="btn-sim" class="flex-1 bg-white border py-2.5 rounded-xl font-bold text-teal-600">SIM</button>
        <button id="btn-nao" class="flex-1 bg-white border py-2.5 rounded-xl font-bold text-red-500">NÃO</button>
      </div>
    </div>
  </div>

  <script type="module" src="executar-treino.js"></script>
</body>
</html>
